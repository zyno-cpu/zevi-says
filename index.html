<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zevi.says</title>
<meta name="description" content="Words from the wall. zevi.says">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Tillana:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --red: #b3261e;
    --cream: #e9dcc3;
    --blue: #3b5b9a;
    --ink-light: #fff4e6;
    --ink-dark: #6d1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #eee;
    font-family: 'Kalam', cursive;
    min-height: 100vh;
    padding: 0 16px 60px;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(0,0,0,.80), rgba(0,0,0,.88)),
      url('bg.png') center / cover no-repeat;
  }
  header { text-align: center; padding: 48px 0 28px; }
  .crown { width: 44px; height: auto; margin-bottom: 6px; fill: #f2e6d0; }
  header h1 {
    font-family: 'Tillana', 'Kalam', cursive;
    font-weight: 800;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    color: #f2e6d0;
    letter-spacing: 1px;
  }
  header p { color: #a39b8d; font-size: 1.05rem; margin-top: 6px; }
  .bar { width: 64px; height: 4px; background: var(--red); margin: 14px auto 0; border-radius: 2px; }

  .wall {
    max-width: 960px;
    margin: 0 auto;
    columns: 2 280px;
    column-gap: 22px;
  }
  .card {
    break-inside: avoid;
    margin: 0 0 22px;
    padding: 30px 24px 22px;
    position: relative;
    box-shadow: 0 10px 28px rgba(0,0,0,.6);
    transform: rotate(var(--tilt, 0deg));
    transition: transform .25s ease;
    cursor: pointer;
    background-image:
      radial-gradient(rgba(0,0,0,.10) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 5px 5px, 9px 9px;
  }
  .card:hover { transform: rotate(0deg) scale(1.02); }
  .card .q {
    font-weight: 700;
    font-size: clamp(1.35rem, 5.2vw, 1.8rem);
    line-height: 1.5;
    white-space: pre-line;
  }
  .card .by { margin-top: 14px; font-size: 1rem; opacity: .8; }
  .card .date { font-size: .8rem; opacity: .55; margin-top: 2px; }

  .red   { background-color: var(--red);   color: var(--ink-light); }
  .cream { background-color: var(--cream); color: var(--ink-dark); border: 6px solid #2a2118; }
  .blue  { background-color: var(--blue);  color: #f4f7ff; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
    background: #222; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: .95rem; transition: transform .3s; z-index: 9;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .empty { text-align: center; color: #888; padding: 40px 0; }
  footer { text-align: center; color: #7a7366; margin-top: 30px; font-size: .95rem; }
</style>
</head>
<body>
  <header>
    <svg class="crown" viewBox="0 0 64 44" aria-hidden="true">
      <path d="M4 36 L10 8 L22 22 L32 2 L42 22 L54 8 L60 36 Z"/>
      <rect x="6" y="39" width="52" height="4" rx="1"/>
    </svg>
    <h1>zevi.says</h1>
    <p>words I left on the walls</p>
    <div class="bar"></div>
  </header>

  <main class="wall" id="wall"></main>
  <div class="toast" id="toast">Quote copied ✓</div>
  <footer>@zevi.says</footer>

<script>
  const wall = document.getElementById('wall');
  const toast = document.getElementById('toast');
  const tilts = [-1.6, 1.2, -0.8, 1.8, -1.2, 0.6];

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showToast() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  function render(list) {
    if (!list.length) {
      wall.innerHTML = '<p class="empty">No quotes yet…</p>';
      return;
    }
    const items = [...list].reverse();
    wall.innerHTML = items.map((q, i) => `
      <article class="card ${esc(q.style || ['red','cream','blue'][i % 3])}" style="--tilt:${tilts[i % tilts.length]}deg">
        <div class="q">${esc(q.text)}</div>
        ${q.author ? `<div class="by">~ ${esc(q.author)}</div>` : ''}
        ${q.date ? `<div class="date">${esc(q.date)}</div>` : ''}
      </article>`).join('');

    wall.querySelectorAll('.card').forEach((el, i) => {
      el.addEventListener('click', async () => {
        const q = items[i];
        const txt = q.text + (q.author ? '\n~ ' + q.author : '');
        try { await navigator.clipboard.writeText(txt); showToast(); } catch (e) {}
      });
    });
  }

  fetch('quotes.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      wall.innerHTML = '<p class="empty">Could not load quotes.json. Open the site through a server, not as a file.</p>';
    });
</script>
</body>
</html>
